# The four hermetic verification gates from AGENTS.md (#043), plus an opt-in
# smoke job that exercises the real chafa binary and ImageMagick. The smoke
# runner exits 0 with a SKIPPED line when either tool is missing, so installing
# them is what makes the job meaningful rather than merely safe.
#
# Security: actions pinned to full commit SHAs, least-privilege permissions, and
# checkout drops the GitHub credentials (nothing in this workflow pushes).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Verification gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # pi-lens-ignore: line-length
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Build
        run: npm run build

  smoke:
    name: Smoke (real chafa + ImageMagick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # pi-lens-ignore: line-length
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install chafa and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y chafa imagemagick
      - name: Smoke run
        run: npm run test:smoke
